name: Generate EPG Channel Database

# Regenerates the curated Vavoo channel name -> EPG feed id mapping
# (epg-channel-db/vavoo_channels_<cc>.json) that vUtils.py's
# _load_curated_channel_db() downloads on-box - from this repository
# (CURATED_DB_HOST = UPDATE_HOST, OwnerPlugins/vavoo main), where this
# workflow commits it.
#
# It runs on GitHub's own runners: tests/headless_proxy.py starts the
# plugin's proxy there with Enigma2 faked (as the tests do), its catalog
# from the network (Geil first, which needs no token). The generator
# then matches each country's live channel list (the proxy's /channels)
# against the guide the plugin itself reads (the proxy's /epg/<cc>.xml:
# epgshare01's daily files, else the GitHub copy). It used to need a
# self-hosted runner beside a box; none was online after 2026-10-12, so
# every weekly run waited 24 h and was cancelled.

# Scheduled + manual-dispatch runs can otherwise overlap (a manual
# retry during the weekly run, or two manual runs) and race on the
# commit step's git pull --rebase + push - queue them instead of
# letting a losing push just fail outright.
concurrency:
  group: generate-epg-channel-db
  cancel-in-progress: false

on:
  schedule:
    # Weekly - Vavoo's catalog and the guides don't churn fast enough to
    # need this more often.
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      countries:
        description: 'Space-separated country codes to override the default --all sweep (e.g. "fr ru" to retry just those)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the plugin's own dependencies
        run: python -m pip install six requests

      - name: Start the plugin's proxy (Enigma2 faked)
        run: |
          nohup python3 tests/headless_proxy.py --port 4323 --wait 600 \
            > "$RUNNER_TEMP/proxy.log" 2>&1 &
          for i in $(seq 1 330); do
            if grep -q "^READY" "$RUNNER_TEMP/proxy.log"; then
              grep "^READY" "$RUNNER_TEMP/proxy.log"
              exit 0
            fi
            if grep -q "^NO CATALOG" "$RUNNER_TEMP/proxy.log"; then
              break
            fi
            sleep 2
          done
          echo "The proxy has no catalog:"
          tail -60 "$RUNNER_TEMP/proxy.log"
          exit 1

      - name: Generate channel database
        working-directory: usr/lib/enigma2/python/Plugins/Extensions/vavoo
        env:
          COUNTRIES_INPUT: ${{ github.event.inputs.countries }}
        run: |
          # Default: every country Vavoo's own catalog actually offers
          # (VAVOO_COUNTRIES in the script) - countries with no guide are
          # skipped, not treated as failures. Pass a manual `countries`
          # input to override with an explicit subset instead.
          if [ -n "$COUNTRIES_INPUT" ]; then
            echo "Generating for: $COUNTRIES_INPUT"
            python3 generate_epg_channel_db.py $COUNTRIES_INPUT \
              --proxy-host 127.0.0.1 --proxy-port 4323 \
              --output-dir "$GITHUB_WORKSPACE/epg-channel-db"
          else
            echo "Generating for: --all"
            python3 generate_epg_channel_db.py --all \
              --proxy-host 127.0.0.1 --proxy-port 4323 \
              --output-dir "$GITHUB_WORKSPACE/epg-channel-db"
          fi

      - name: The proxy's log
        if: always()
        run: tail -80 "$RUNNER_TEMP/proxy.log" || true

      - name: Commit and push changes
        # (also after a country failed: the generator writes only the
        # countries that worked, and the run still shows the failure)
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add epg-channel-db/
          if ! git diff --cached --quiet; then
            git commit -m "Update curated EPG channel database"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "${GITHUB_REF_NAME}"
          else
            echo "No changes to commit"
          fi
